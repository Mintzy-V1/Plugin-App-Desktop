name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # electron-updater reads version from latest.yml, which electron-builder
      # writes from package.json — not from the git tag. A tag like v1.2.5 with
      # package.json still at 1.2.4 ships a 1.2.4 installer and users never update.
      - name: Verify package.json version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build:renderer

      # Build only — electron-builder's built-in GitHub publish has been racing
      # (duplicate create-release calls) and exiting green without leaving a Release.
      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      # latest.yml uses hyphenated names (spaces → -). softprops turns spaces into
      # dots, which breaks electron-updater downloads — normalize before upload.
      - name: Normalize asset names for updater
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in *.exe *.exe.blockmap; do
            [ -e "$f" ] || continue
            new="${f// /-}"
            if [ "$f" != "$new" ]; then
              mv "$f" "$new"
            fi
          done
          ls -la
          test -f latest.yml
          grep -E '^path:' latest.yml
          TAG="${GITHUB_REF_NAME#v}"
          grep -E "^version: ${TAG}$" latest.yml
          test -f "Mintzy-Plugin-Setup-${TAG}.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mintzy Plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

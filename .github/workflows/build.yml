name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build:renderer

      # Build only — electron-builder's built-in GitHub publish has been racing
      # (duplicate create-release calls) and exiting green without leaving a Release.
      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      # latest.yml uses hyphenated names (spaces → -). softprops turns spaces into
      # dots, which breaks electron-updater downloads — normalize before upload.
      - name: Normalize asset names for updater
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in *.exe *.exe.blockmap; do
            [ -e "$f" ] || continue
            new="${f// /-}"
            if [ "$f" != "$new" ]; then
              mv "$f" "$new"
            fi
          done
          ls -la
          test -f latest.yml
          grep -E '^path:' latest.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mintzy Plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
